# Ders demosu: Free planda SQLite dosyasi yeniden baslatmada kaybolabilir.
# Kalici kayit icin README'deki disk kurulumunu uygulayin.
services:
  - type: web
    name: stay-focused-ai
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
